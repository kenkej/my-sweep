# Ferris Sweep (cradio shield) has no RGB underglow or OLED displays.

CONFIG_ZMK_KEYBOARD_NAME="hisu sweep"
CONFIG_ZMK_POINTING=y
# Auto deep sleep disabled; power down explicitly via &soft_off instead.
CONFIG_ZMK_SLEEP=n

# Soft off: &soft_off in the keymap powers the keyboard down explicitly.
# No dedicated hardware button, so waking back up requires the reset button
# on each half (see https://zmk.dev/docs/features/low-power-states#soft-off).
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_BT_BAS=y

CONFIG_ZMK_BLE=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=n

CONFIG_ZMK_SPLIT_BLE=y

# Globe key (C_AC_NEXT_KEYBOARD_LAYOUT_SELECT, consumer usage 0x29D) is outside
# the BASIC consumer report range (<= 0xFF), so it is silently dropped unless
# the full consumer usage range is enabled.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
